name: Release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Reject agent-control files
        run: python3 scripts/check-release-tree.py
      - name: Helper unit tests
        run: |
          python3 scripts/test-pia-exec.py
          python3 scripts/test-region-coords.py
